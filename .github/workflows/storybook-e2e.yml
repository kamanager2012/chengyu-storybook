name: storybook fork PR E2E

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.*'
      - '.github/workflows/storybook-e2e.yml'

concurrency:
  group: fork-pr-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    name: Chromium desktop + mobile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: fork-pr-playwright-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
