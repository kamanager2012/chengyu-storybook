name: storybook fork PR CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'playwright.config.*'
      - '.github/workflows/storybook-ci.yml'

concurrency:
  group: fork-pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Inventory imported dependencies
        run: node scripts/dependency-inventory.mjs
      - run: npm ci
      - name: Lint with zero-warning policy
        run: npm run lint -- --max-warnings=0
      - run: npm run check:fast

  dependency-audit:
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Inventory imported dependencies
        run: node scripts/dependency-inventory.mjs
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
